[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "modera"
version = "0.1.0"
description = "Text and photo moderation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "fastapi>=0.141.1,<0.142",
    "pillow>=13.0.0,<14",
    "pydantic-settings>=2.0,<3",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
inference = [
    "torch>=2.13,<3",
    "transformers>=5.20.2,<6",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.0,<2",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["inference: tests local model adapters; requires the inference extra"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
