name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: go test -race ./...
        working-directory: clients/go
      - run: go vet ./...
        working-directory: clients/go
      - name: Verify Go client against the local API
        run: uv run --locked python clients/go/integration.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group benchmark
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked --group benchmark mypy src tests benchmarks examples deploy evaluation clients/go/integration.py
      - name: Check benchmark entry points
        run: |
          uv run --locked --group benchmark python benchmarks/run.py --help
          uv run --locked python benchmarks/prepare_models.py --help
          uv run --locked python benchmarks/server.py --help
          uv run --locked python -m evaluation.compare_text --help
          uv run --locked python -m evaluation.diagnose --help
          uv run --locked python -m evaluation.calibrate --help
          uv run --locked python -m evaluation.assess --help
          uv run --locked python -m evaluation.external_text --help
          uv run --locked python -m evaluation.photo_challenge --help
          uv run --locked python -m evaluation.error_audit --help
          uv run --locked python -m evaluation.next_models --help
          uv run --locked python -m evaluation.qwen_probes --help
          uv run --locked python -m evaluation.review --help
      - run: uv run --locked pytest
      - run: uv build

  inference:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra inference
      - run: uv run --locked --extra inference pytest -m inference
      - name: Build inference container
        run: docker build --build-arg INFERENCE=true -t modera:ci-inference .
      - name: Verify read-only inference container and restart
        env:
          MODERA_TEST_CONTAINER_IMAGE: modera:ci-inference
          MODERA_TEST_LIVE_SOURCES: '1'
        run: uv run --locked --extra inference pytest tests/integration/test_container.py tests/integration/test_compose.py -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -t modera:ci .
      - run: |
          export MODERA_API_KEY="$(openssl rand -hex 32)"
          docker run -d --name modera --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp \
            -e MODERA_API_KEY -p 127.0.0.1:8000:8000 modera:ci
      - run: >-
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1
          --retry-max-time 30 --max-time 2 http://127.0.0.1:8000/health/ready
      - name: Verify container authentication
        run: |
          docker exec -i modera python - <<'PY'
          import json
          import os
          from io import BytesIO
          import urllib.error
          import urllib.request
          from PIL import Image

          for authenticated, status, code in [
              (False, 401, "authentication_required"),
              (True, 501, "moderation_not_implemented"),
          ]:
              headers = {"Content-Type": "application/json"}
              if authenticated:
                  headers["Authorization"] = "Bearer " + os.environ["MODERA_API_KEY"]
              request = urllib.request.Request(
                  "http://127.0.0.1:8000/v1/moderations",
                  data=b'{"input":{"type":"text","text":"hello"}}', headers=headers,
              )
              try:
                  urllib.request.urlopen(request, timeout=5)
              except urllib.error.HTTPError as response:
                  assert response.code == status
                  body = json.load(response)["error"]
                  assert body["code"] == code
                  assert body["request_id"] == response.headers["X-Request-ID"]
              else:
                  raise AssertionError("expected an error response")
          print("Container authentication checks passed")
          for image_format in ("JPEG", "PNG", "WEBP"):
              with BytesIO() as buffer, Image.new("RGB", (2, 2), "white") as image:
                  image.save(buffer, format=image_format)
                  data = buffer.getvalue()
              body = (
                  b'--smoke\r\nContent-Disposition: form-data; name="file"; filename="image"\r\n'
                  b'Content-Type: application/octet-stream\r\n\r\n' + data + b'\r\n--smoke--\r\n'
              )
              request = urllib.request.Request(
                  "http://127.0.0.1:8000/v1/moderations", data=body,
                  headers={"Authorization": "Bearer " + os.environ["MODERA_API_KEY"],
                           "Content-Type": "multipart/form-data; boundary=smoke"},
              )
              try:
                  urllib.request.urlopen(request, timeout=10)
              except urllib.error.HTTPError as response:
                  assert response.code == 501
                  assert json.load(response)["error"]["code"] == "moderation_not_implemented"
              else:
                  raise AssertionError("expected moderation to remain unimplemented")
          print("Container image codec checks passed")
          PY
      - name: Verify rules-only container
        run: |
          export MODERA_API_KEY="$(openssl rand -hex 32)"
          docker run -d --name modera-rules --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp \
            -e MODERA_API_KEY -e MODERA_POLICY_FILE=/etc/modera/policies.json \
            -e MODERA_TEXT_RULES_FILE=/etc/modera/text-rules.json \
            -v "$PWD/examples/policies.json:/etc/modera/policies.json:ro" \
            -v "$PWD/examples/text-rules.json:/etc/modera/text-rules.json:ro" \
            modera:ci
          docker exec -i modera-rules python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          for attempt in range(20):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2).close()
                  break
              except (urllib.error.URLError, TimeoutError, ConnectionError):
                  time.sleep(0.5)
          else:
              raise AssertionError("rules container did not become ready")
          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/moderations",
              data=json.dumps({"input":{"type":"text","text":"example prohibited phrase"},
                               "policy":"rules-only"}).encode(),
              headers={"Authorization":"Bearer " + os.environ["MODERA_API_KEY"],
                       "Content-Type":"application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              result = json.load(response)
              assert response.status == 200
              assert result["decision"]["action"] == "block"
              assert result["models"] == []
              assert result["rules_version"] == "1"
              assert result["findings"][0]["source"] == "rules"
          print("Rules-only container checks passed")
          PY
      - if: always()
        run: docker logs modera
      - if: always()
        run: docker rm -f modera modera-rules
