name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - name: Check Go formatting
        run: test -z "$(gofmt -l clients/go)"
      - run: go test -race ./...
        working-directory: clients/go
      - run: go vet ./...
        working-directory: clients/go
      - name: Staticcheck Go client
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
        working-directory: clients/go
      - name: Verify Go client and application against the local API
        run: uv run --locked python clients/go/integration.py
      - name: Install SDK into an external consumer
        run: >-
          uv run --locked python clients/go/consumer_check.py
          --revision "${{ github.event.pull_request.head.sha || github.sha }}"

  go-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.23.12'
          cache: false
      - name: Verify declared minimum language compatibility
        run: |
          go version
          go test ./...
        working-directory: clients/go

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group loadtest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked --group loadtest mypy src tests loadtests examples e2e evaluation .github/scripts clients/go/integration.py clients/go/consumer_check.py
      - name: Check load-test entry points
        run: |
          uv run --locked --group loadtest python loadtests/run.py --help
          uv run --locked python loadtests/prepare_models.py --help
          uv run --locked python loadtests/server.py --help
          uv run --locked python -m evaluation.photos --help
      - run: uv run --locked pytest
      - run: uv build

  onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra onnx
      - name: Verify ONNX works without torch
        run: |
          uv run --locked --extra onnx python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          uv run --locked --extra onnx pytest -m onnx
      - name: Build ONNX-only container
        run: docker build --build-arg ONNX=true -t modera:ci-onnx .

  inference:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra inference
      - run: uv run --locked --extra inference pytest -m inference
      - name: Build inference container
        run: docker build --build-arg INFERENCE=true -t modera:ci-inference .
      - name: Verify read-only inference container and restart
        env:
          MODERA_TEST_CONTAINER_IMAGE: modera:ci-inference
          MODERA_TEST_LIVE_SOURCES: '1'
        run: uv run --locked --extra inference pytest tests/integration/test_container.py tests/integration/test_compose.py -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -t modera:ci .
      - run: |
          export MODERA_API_KEY="$(openssl rand -hex 32)"
          docker run -d --name modera --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp \
            -e MODERA_API_KEY -p 127.0.0.1:8000:8000 modera:ci
      - run: >-
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1
          --retry-max-time 30 --max-time 2 http://127.0.0.1:8000/health/ready
      - name: Verify container authentication and image codecs
        run: docker exec -i modera python - < .github/scripts/check_unconfigured_container.py
      - name: Verify rules-only container
        run: |
          export MODERA_API_KEY="$(openssl rand -hex 32)"
          docker run -d --name modera-rules --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp \
            -e MODERA_API_KEY -e MODERA_POLICY_FILE=/etc/modera/policies.json \
            -e MODERA_TEXT_RULES_FILE=/etc/modera/text-rules.json \
            -v "$PWD/examples/policies.json:/etc/modera/policies.json:ro" \
            -v "$PWD/examples/text-rules.json:/etc/modera/text-rules.json:ro" \
            modera:ci
          docker exec -i modera-rules python - < .github/scripts/check_rules_container.py
      - if: always()
        run: docker logs modera
      - if: always()
        run: docker rm -f modera modera-rules
