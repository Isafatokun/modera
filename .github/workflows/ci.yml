name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -t modera:ci .
      - run: >-
          docker run -d --name modera --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --tmpfs /tmp
          -p 127.0.0.1:8000:8000 modera:ci
      - run: >-
          curl --fail --retry 10 --retry-connrefused --retry-delay 1
          --max-time 2 http://127.0.0.1:8000/health/ready
      - if: always()
        run: docker logs modera
      - if: always()
        run: docker rm -f modera
