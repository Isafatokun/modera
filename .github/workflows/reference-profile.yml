name: Reference profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reference-profile.yml'
      - 'deploy/reference/verify.py'

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify real models from an empty cache
        run: python3 deploy/reference/verify.py --output reference-verification
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-verification
          path: reference-verification/
          if-no-files-found: error
          retention-days: 30
