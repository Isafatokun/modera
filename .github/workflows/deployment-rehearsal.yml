name: Deployment rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deployment-rehearsal.yml'
      - 'deploy/rehearsal/**'
      - 'deploy/reference/models.json'
      - 'deploy/reference/policies.json'
      - 'clients/go/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra inference
      - name: Install packaged NGINX gateway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
      - name: Exercise SDK, real models and gateway lifecycle
        run: >-
          uv run --locked --extra inference python deploy/rehearsal/rehearse.py
          --nginx /usr/sbin/nginx --download
          --cache-dir "${{ runner.temp }}/rehearsal-models"
          --output rehearsal-verification
      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-rehearsal
          path: rehearsal-verification/
          if-no-files-found: error
          retention-days: 30
