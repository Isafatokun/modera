name: Text quality comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/text-quality.yml'
      - 'evaluation/*.py'
      - 'evaluation/candidates/*.json'

permissions:
  contents: read

concurrency:
  group: text-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra inference --group evaluation
      - name: Freeze test sample and exclude training overlap
        run: >-
          uv run --locked --extra inference --group evaluation python -m evaluation.compare_text prepare
          --directory evaluation/data/publisher-test --cache model-cache
      - name: Prepare pinned safe model artifacts
        run: >-
          uv run --locked --extra inference --group evaluation python -m evaluation.compare_text models
          --cache model-cache
      - name: Evaluate Horizon
        run: >-
          uv run --locked --extra inference --group evaluation python -m evaluation.compare_text run
          --directory evaluation/data/publisher-test --candidate evaluation/candidates/horizon-small.json
          --cache model-cache --output evaluation/results/horizon-small
      - name: Evaluate Gravitee
        run: >-
          uv run --locked --extra inference --group evaluation python -m evaluation.compare_text run
          --directory evaluation/data/publisher-test --candidate evaluation/candidates/gravitee-distilbert.json
          --cache model-cache --output evaluation/results/gravitee-distilbert
      - name: Diagnose ranking without selecting thresholds
        run: |
          for candidate in horizon-small gravitee-distilbert; do
            uv run --locked --extra inference --group evaluation python -m evaluation.diagnose \
              --directory evaluation/data/publisher-test --run "evaluation/results/$candidate" \
              --output "evaluation/results/$candidate/diagnostic.json"
          done
      - name: Print complete summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('evaluation/results').glob('*/report.json')):
              report = json.loads(path.read_bytes())
              print('QUALITY_REPORT ' + json.dumps(report, sort_keys=True))
          PY
      - name: Retain completed and partial observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: text-quality-comparison
          path: evaluation/results/
          retention-days: 30
          if-no-files-found: warn
